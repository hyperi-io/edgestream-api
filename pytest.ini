[pytest]
filterwarnings =
    # treat your own deprecations as errors (catch them early)
    error::pydantic.PydanticDeprecatedSince20:edgestream\.
    error::sqlalchemy.exc.SADeprecationWarning:edgestream\.

    # ignore site-packages (third-party) noise
    ignore::pydantic.PydanticDeprecatedSince20:.*site-packages.*
    ignore::DeprecationWarning:.*site-packages.*