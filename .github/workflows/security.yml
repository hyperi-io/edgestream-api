name: Python Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Security Tools
        run: |
          pip install bandit pip-audit

      - name: Scan Code for Vulnerabilities (Bandit)
        run: bandit -r ./src -ll

      - name: Scan Dependencies (Pip-Audit)
        run: pip-audit -r requirements-prod.txt

      - name: Verify JWT Migration
        run: |
          if grep -q "python-jose" requirements-prod.txt; then
            echo "Error: python-jose (vulnerable) found in requirements!"
            exit 1
          fi