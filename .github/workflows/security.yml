name: Python Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'

      - name: Install Security Tools
        run: |
          pip install bandit pip-audit

      - name: Scan Code for Vulnerabilities (Bandit)
        run: bandit -r ./src -ll

      - name: Scan Dependencies (Pip-Audit)
        run: pip-audit -r requirements-prod.txt

      - name: Verify JWT Migration
        run: |
          if grep -q "python-jose" requirements-prod.txt; then
            echo "Error: python-jose (vulnerable) found in requirements!"
            exit 1
          fi